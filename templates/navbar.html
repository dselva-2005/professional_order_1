{% load static %}
<link rel="stylesheet" href="{% static 'css/navbar.css' %}">
<style>
  .cactive {
    background-color: #d881a2 !important;
    color: white !important;
    border-radius: 8%;
  }

  .nav-link:hover {
    border: none;
    background-color: #d881a2 !important;
    color: white;
    border-radius: 8%;
  }

 /* Initial navbar (before scroll) */
.navbar {
  transition: transform 0.5s ease, opacity 0.5s ease;
  transform: translateY(0px);
  opacity: 1;
}

/* Sticky navbar (after scroll) */
.navbar.sticky {
  position: fixed;
  top: 0;
  width: 100%;
  z-index: 999;
  background: white;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  animation: slideDown 1s ease-out forwards;
}

/* Define the slideDown animation */
@keyframes slideDown {
  0% {
    transform: translateY(-100px);
    opacity: 0;
  }
  60% {
    transform: translateY(20px);
    opacity: .4;
  }
  80% {
    transform: translateY(-10px);
    opacity: .7;
  }
  100% {
    transform: translateY(0);
    opacity: 1;
  }
}



</style>


<nav id="main-navbar" class="navbar navbar-expand-lg navbar-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <img src="{% static 'images/Logo_croped.png' %}" class="img-fluid mb-3" alt="Logo">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
      aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarCollapse">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 w-100 d-flex justify-content-evenly">
        <li class="nav-item">
          <a class="nav-link {% if active == 'home' %}cactive{% endif %}" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'about_us' %}cactive{% endif %}" href="/about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'services' %}cactive{% endif %}" href="#">Our Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'ebooks' %}cactive{% endif %}" href="{% url 'books:book-list' %}">Ebooks</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'blogs' %}cactive{% endif %}" href="#">Blogs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'workshops' %}cactive{% endif %}" href="/workshops">Workshops</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'contact_us' %}cactive{% endif %}" href="/contact">Contact Us</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<script>
  window.addEventListener('scroll', function() {
    var navbar = document.getElementById('main-navbar');
    if (window.scrollY > 80) {
      navbar.classList.add('sticky');
    } else {
      navbar.classList.remove('sticky');
    }
  });
</script>
