{% load static %}
<link rel="stylesheet" href="{% static 'css/navbar.css' %}">

<nav class="navbar navbar-expand-md navbar-light fixed-top bg-white">
  <div class="container-fluid">
    <!-- Logo stays on the left -->
    <a class="navbar-brand" href="/">
      <img src="{% static 'images/Logo_croped.png' %}" class="img-fluid mb-3" alt="Logo">
    </a>

    <!-- Collapsible toggle for mobile -->
    <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible navbar links -->
    <div class="navbar-collapse collapse" id="navbarCollapse">
      <ul class="navbar-nav me-auto mb-2 mb-md-0 w-100 d-flex justify-content-evenly">
        <li class="nav-item">
          <a class="nav-link {% if active == 'home' %}active{% endif %}" href="/">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'about_us' %}active{% endif %}" href="/about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'services' %}active{% endif %}" href="#">Our Services</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'ebooks' %}active{% endif %}" href="{% url 'books:book-list' %}">Ebooks</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'blogs' %}active{% endif %}" href="#">Blogs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'workshops' %}active{% endif %}" href="/workshops">Workshops</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if active == 'contact_us' %}active{% endif %}" href="/contact">Contact Us</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
